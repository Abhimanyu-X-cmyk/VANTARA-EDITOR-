<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VANTARA EDITOR — Real Voiceover</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px}.brand{font-size:22px;font-weight:800}.muted{color:#9aa3ad}.card{background:#14181d;border:1px solid #2a3038;border-radius:18px;padding:20px;margin-top:18px}textarea{width:100%;min-height:300px;resize:vertical;background:#0d1014;color:#fff;border:1px solid #343b44;border-radius:12px;padding:15px;font-size:16px;line-height:1.6}select,button{border-radius:10px;padding:12px;border:1px solid #39414b;background:#1b2128;color:#fff;font-size:15px}button{cursor:pointer}.primary{background:#fff;color:#111;border:0;font-weight:700;width:100%;margin-top:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.field label{display:block;margin-bottom:7px;color:#aeb7c1;font-size:13px}.status{margin-top:14px;color:#aeb7c1}.success{color:#7ee787}.error{color:#ff7b72}.parts{margin-top:12px;font-size:13px;color:#9aa3ad}audio{width:100%;margin-top:16px}.download{display:block;margin-top:12px;color:#fff;text-decoration:none;border:1px solid #444;padding:12px;border-radius:10px;text-align:center}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="brand">VANTARA EDITOR <span class="muted">• Real Voiceover</span></div><p class="muted">Sarvam Bulbul V3 • automatic long-script splitting • downloadable WAV</p><section class="card"><h2>Voiceover Studio</h2><textarea id="script" placeholder="Paste your complete teacher script here..."></textarea><div class="grid"><div class="field"><label>Language</label><select id="language"><option value="hi-IN">Hindi / Hinglish</option><option value="en-IN">English (Indian)</option></select></div><div class="field"><label>Teacher voice</label><select id="speaker"><option value="shubh">Shubh</option><option value="aditya">Aditya</option><option value="rahul">Rahul</option><option value="rohan">Rohan</option><option value="amit">Amit</option><option value="dev">Dev</option><option value="ratan">Ratan</option><option value="varun">Varun</option><option value="manan">Manan</option><option value="sumit">Sumit</option><option value="kabir">Kabir</option><option value="tarun">Tarun</option><option value="mohit">Mohit</option><option value="rehan">Rehan</option><option value="soham">Soham</option></select></div><div class="field"><label>Speaking speed</label><select id="pace"><option value="0.85">Slow classroom</option><option value="1" selected>Normal classroom</option><option value="1.1">Slightly fast</option></select></div></div><button id="generate" class="primary">Generate Real Voiceover</button><div id="status" class="status"></div><div id="parts" class="parts"></div><audio id="audio" controls hidden></audio><a id="download" class="download" hidden>Download Voiceover</a></section></div><script src="app.js"></script></body></html>
